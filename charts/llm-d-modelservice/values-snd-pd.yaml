multinode: false

modelArtifacts:
  uri: "hf://Qwen/Qwen2.5-0.5B-Instruct"
  name: "Qwen/Qwen2.5-0.5B-Instruct"
  size: 5Gi
  authSecretName: "llm-d-hf-token"
  labels:
    llm-d.ai/inference-serving: "true"
    llm-d.ai/guide: "precise-prefix-cache-aware"
    llm-d.ai/hardware-variant: "cpu"
    llm-d.ai/model: "Qwen2.5-0.5B-Instruct"

routing:
  servicePort: 8000
  proxy:
    enabled: true
    image: ghcr.io/llm-d/llm-d-routing-sidecar:v0.7.1
    imagePullPolicy: IfNotPresent
    connector: nixlv2
    secure: false
    zapLogLevel: error

accelerator:
  type: cpu

decode:
  create: true
  replicas: 1
  monitoring:
    podmonitor:
      enabled: true
      portName: vllm
      path: /metrics
      interval: "30s"
  containers:
    - name: vllm
      image: ghcr.io/llm-d/llm-d-cpu:v0.6.0
      imagePullPolicy: IfNotPresent
      modelCommand: vllmServe
      securityContext:
        seccompProfile:
          type: Unconfined
        capabilities:
          add:
            - SYS_NICE
      args:
        - "--disable-hybrid-kv-cache-manager"
        - "--max_model_len"
        - "2048"
        - "--block-size=32"
        - "--enforce-eager"
        - "--kv-events-config"
        - |-
          {
            "enable_kv_cache_events": true,
            "publisher": "zmq",
            "endpoint": "tcp://gaie-$(GAIE_RELEASE_NAME_POSTFIX)-epp.$(NAMESPACE).svc.cluster.local:5557",
            "topic": "kv@$(POD_IP):8200@Qwen/Qwen2.5-0.5B-Instruct"
          }
        - "--kv-transfer-config"
        - '{"kv_connector":"NixlConnector", "kv_role":"kv_both", "kv_buffer_device":"cpu"}'
        - "--disable-uvicorn-access-log"
      env:
        - name: GAIE_RELEASE_NAME_POSTFIX
          value: "kv-events"
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIP
        - name: VLLM_LOGGING_LEVEL
          value: DEBUG
        - name: VLLM_CPU_NUM_OF_RESERVED_CPU
          value: "1"
        - name: VLLM_CPU_KVCACHE_SPACE
          value: "1"
        - name: TRITON_CACHE_DIR
          value: /.triton-cache
        - name: VLLM_NIXL_SIDE_CHANNEL_PORT
          value: "5600"
        - name: VLLM_NIXL_SIDE_CHANNEL_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
      ports:
        - containerPort: 8200
          name: vllm
          protocol: TCP
        - containerPort: 5600
          name: nixl
          protocol: TCP
      resources:
        limits:
          cpu: "2"
          memory: 4Gi
        requests:
          cpu: "2"
          memory: 4Gi
      device: "cpu"
      mountModelVolume: true
      volumeMounts:
        - name: metrics-volume
          mountPath: /.config
        - name: torch-compile-cache
          mountPath: /.cache
        - name: dshm
          mountPath: /dev/shm
        - name: triton-cache
          mountPath: /.triton-cache
      startupProbe:
        httpGet:
          path: /v1/models
          port: vllm
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 180
      livenessProbe:
        httpGet:
          path: /health
          port: vllm
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: /v1/models
          port: vllm
        periodSeconds: 5
        timeoutSeconds: 2
        failureThreshold: 3
  volumes:
    - name: metrics-volume
      emptyDir: {}
    - name: torch-compile-cache
      emptyDir: {}
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 1Gi
    - name: triton-cache
      emptyDir: {}

